<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Vanshjeet Singh portfolio favicon</title>
  <desc id="desc">Animated EBOX-inspired geometric mark on a dark rounded tile.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09090b" />
      <stop offset="1" stop-color="#121219" />
    </linearGradient>
    <linearGradient id="mark-gradient" x1="18" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f7da">
        <animate attributeName="stop-color" values="#f8f7da;#f4d7a1;#f8f7da" dur="4.8s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#78e5ff">
        <animate attributeName="stop-color" values="#78e5ff;#b493ff;#78e5ff" dur="4.8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#78e5ff" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#f8f7da" flood-opacity="0.2" />
    </filter>
    <clipPath id="tile-clip">
      <rect x="4" y="4" width="56" height="56" rx="16" ry="16" />
    </clipPath>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="16" ry="16" fill="url(#bg-gradient)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" ry="15.5" fill="none" stroke="rgba(255,255,255,0.12)" />

  <g clip-path="url(#tile-clip)">
    <circle cx="17" cy="18" r="16" fill="#78e5ff" opacity="0.08">
      <animate attributeName="opacity" values="0.04;0.11;0.04" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="46" cy="46" r="18" fill="#f4d7a1" opacity="0.06">
      <animate attributeName="opacity" values="0.03;0.09;0.03" dur="5.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <g filter="url(#glow)" transform="translate(8 8)">
    <g transform-origin="24px 24px">
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3.6s" repeatCount="indefinite" />
      <path
