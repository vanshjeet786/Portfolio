        fill="url(#mark-gradient)"
      />
      <path
        d="m1.878 29.946 10.97 6.4V39L1.878 32.6v-2.654zm44.245 0V32.6L35.152 39v-2.654l10.97-6.4ZM1.878 25.633l10.97 6.4v2.653L5.625 30.47l-1.068 0.622 -2.253 -1.313 1.07 -0.623 -1.496 -0.873v-2.628zm44.245 0v2.627l-1.496 0.874 1.07 0.623 -2.253 1.313 -1.07 -0.622 -7.223 4.214v-2.653l10.972 -6.4ZM1.878 21.32l10.97 6.4v2.654l-3.525 -2.058 -1.067 0.623 -2.252 -1.315 1.067 -0.621 -1.429 -0.834 -1.066 0.622 -2.253 -1.314 1.068 -0.621 -1.514 -0.884Zm44.245 0v2.626l-1.514 0.884 1.07 0.621 -2.254 1.315 -1.068 -0.622 -1.428 0.834 1.068 0.621 -2.252 1.315 -1.07 -0.623 -3.525 2.058V27.72l10.972 -6.4Zm-11.062 2.237 3.236 1.885 -2.252 1.315 -0.983 -0.573 -0.982 0.573 -2.252 -1.315 3.235 -1.885Zm0 -4.293 6.916 4.03 -2.252 1.315 -4.664 -2.718 -4.662 2.718 -2.253 -1.314Zm0 -4.291 10.597 6.174 -2.252 1.315 -8.345 -4.862 -8.343 4.862 -2.252 -1.315 10.595 -6.174Z"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.16"
        stroke-width="0.6"
      >
        <animate attributeName="stroke-opacity" values="0.1;0.28;0.1" dur="3.6s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>
